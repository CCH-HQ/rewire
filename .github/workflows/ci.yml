name: Rust CI

on:
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust 1.94.0 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Keep CI aligned with rust-toolchain.toml and install the cross-check target once.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu

      # `ring` needs the target C compiler; installer scripts are linted with the runner package.
      - name: Install CI system tools
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64 shellcheck

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Unix installer scripts
        run: |
          shellcheck scripts/install.sh \
            scripts/tests/install-unix.sh \
            scripts/tests/install-docker-e2e.sh

      - name: Check Docker E2E verifier syntax
        run: |
          python3 -c 'from pathlib import Path; p = Path("scripts/tests/verify-docker-e2e.py"); compile(p.read_bytes(), str(p), "exec")'

      - name: Test Unix installer
        run: sh scripts/tests/install-unix.sh

      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Check Windows GNU target
        run: cargo check --locked --target x86_64-pc-windows-gnu --all-targets

  installer-windows:
    name: Test Windows installer
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows fixture binary
        run: cargo build --locked

      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/tests/install-windows.ps1 -BinaryPath target/debug/rewire.exe
