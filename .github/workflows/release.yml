name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: rewire
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: rewire
            archive: tar
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: rewire
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: rewire
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: rewire.exe
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: rewire.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build musl release binary
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        shell: bash
        env:
          REWIRE_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release --target ${{ matrix.target }} --config 'target.${{ matrix.target }}.linker="musl-gcc"'

      - name: Build native release binary
        if: ${{ !startsWith(matrix.target, 'x86_64-unknown-linux-musl') && !startsWith(matrix.target, 'aarch64-unknown-linux-musl') }}
        env:
          REWIRE_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify Linux binary is fully static
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if readelf --program-headers "$binary" | grep -q 'Requesting program interpreter'; then
            echo "Linux release binary unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" | grep -q '(NEEDED)'; then
            echo "Linux release binary unexpectedly has dynamic library dependencies" >&2
            exit 1
          fi

      - name: Stage Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist/package dist/sbom-root
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/rewire
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/sbom-root/rewire
          cp README.md CHANGELOG.md LICENSE dist/package/
          tar -C dist/package -czf "dist/rewire-${{ matrix.target }}.tar.gz" .

      - name: Stage Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package,dist/sbom-root | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/rewire.exe
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/sbom-root/rewire.exe
          Copy-Item README.md,CHANGELOG.md,LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/rewire-${{ matrix.target }}.zip"

      - name: Generate binary SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/sbom-root
          format: spdx-json
          output-file: dist/rewire-${{ matrix.target }}.spdx.json
          upload-artifact: false

      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/rewire-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign, attest, and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Extract curated release notes
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=${RUNNER_TEMP}/rewire-release-notes.md
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:[[:space:]]/ { exit }
            capture { print }
            END { if (!capture) exit 1 }
          ' CHANGELOG.md > "${notes}"
          test -s "${notes}"

      - name: Generate aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum rewire-*.tar.gz rewire-*.zip > SHA256SUMS

      - name: Install Cosign
        # The installer publishes exact release tags; there is no moving v4 tag.
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign archives and checksums with GitHub OIDC
        shell: bash
        run: |
          for artifact in dist/rewire-*.tar.gz dist/rewire-*.zip dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/rewire-*.tar.gz
            dist/rewire-*.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/rewire-release-notes.md
          fail_on_unmatched_files: true
          files: dist/*
